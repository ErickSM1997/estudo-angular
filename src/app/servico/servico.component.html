        <div>
            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef> Nome </th>
                    <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
                </ng-container>


                <ng-container matColumnDef="descricao">
                    <th mat-header-cell *matHeaderCellDef> Descrição </th>
                    <td mat-cell *matCellDef="let element"> {{element.descricao}} </td>
                </ng-container>


                <ng-container matColumnDef="duracao">
                    <th mat-header-cell *matHeaderCellDef> Duração </th>
                    <td mat-cell *matCellDef="let element"> {{element.duracao}} </td>
                </ng-container>


                <ng-container matColumnDef="preco">
                    <th mat-header-cell *matHeaderCellDef> Preço </th>
                    <td mat-cell *matCellDef="let element"> {{element.preco}} </td>
                </ng-container>

                <ng-container matColumnDef="comissao">
                    <th mat-header-cell *matHeaderCellDef> Comissão </th>
                    <td mat-cell *matCellDef="let element"> {{element.comissao}} </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>


        </div>


    </div>


</body>
